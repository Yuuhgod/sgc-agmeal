services:
  agmeal-app:
    build: .
    container_name: sgc-agmeal-web
    restart: unless-stopped
    expose:
      - "5000"
    volumes:
      - ./data:/sgc/data
      - ./uploads:/sgc/app/static/uploads/fotos
    environment:
      - TZ=America/Maceio
      - FLASK_HOST=0.0.0.0
      - FLASK_DEBUG=false
      - GUNICORN_WORKERS=3
      - GUNICORN_TIMEOUT=60
      # Defina SECRET_KEY em um arquivo .env para n\u00e3o depender do .flask_secret no host.
      # - SECRET_KEY=${SECRET_KEY}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: sgc-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      agmeal-app:
        condition: service_healthy

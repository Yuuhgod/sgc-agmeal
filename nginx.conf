events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    gzip               on;
    gzip_comp_level    5;
    gzip_min_length    256;
    gzip_proxied       any;
    gzip_vary          on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        image/svg+xml;

    # Log em stdout/stderr do container.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Limita abuso nas rotas de autenticação (brute force).
    # 1 req/s com burst de 10 permite uso humano normal mas bloqueia scripts.
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=1r/s;
    limit_req_status 429;

    server {
        listen 80;
        server_name _;

        client_max_body_size 10m;

        location = /login {
            limit_req zone=login_zone burst=10 nodelay;
            proxy_pass http://agmeal-app:5000;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /esqueci_senha {
            limit_req zone=login_zone burst=5 nodelay;
            proxy_pass http://agmeal-app:5000;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://agmeal-app:5000;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}

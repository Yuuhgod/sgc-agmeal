{% extends "base.html" %}

{% block title %}SGC - {{ titulo }}{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow-sm border-0 text-center">
            <div class="card-body p-5">
                <i class="fa-solid {{ icone }} fa-3x mb-3" style="color: var(--agmeal-azul);"></i>
                <p class="text-muted small mb-1">Erro {{ codigo }}</p>
                <h1 class="h4 mb-3">{{ titulo }}</h1>
                <p class="text-muted">{{ mensagem }}</p>
                <div class="d-flex justify-content-center gap-2 mt-4">
                    <a href="javascript:history.back()" class="btn btn-outline-secondary">Voltar</a>
                    <a href="{{ url_for('dashboard') }}" class="btn btn-primary-agmeal">Ir para o início</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

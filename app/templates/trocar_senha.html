{% extends "base.html" %}

{% block title %}SGC - Criar Nova Senha{% endblock %}

{% block content %}
<div class="row justify-content-center mt-3">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 border-top border-warning border-3">
            <div class="card-header bg-white pb-0 border-0 pt-4">
                <h4 style="color: var(--agmeal-azul);"><i class="fa-solid fa-key me-2 text-warning"></i>Crie a sua senha</h4>
                <p class="text-muted small">Você entrou com uma senha provisória. Para continuar, crie uma senha pessoal que só você conheça.</p>
            </div>
            <div class="card-body">
                <form action="{{ url_for('trocar_senha') }}" method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="mb-3">
                        <label class="form-label fw-bold" for="nova_senha">Nova senha</label>
                        <input type="password" class="form-control" name="nova_senha" id="nova_senha" minlength="8" required autocomplete="new-password" autofocus>
                        <small class="text-muted">Mínimo de 8 caracteres.</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold" for="confirmacao">Confirmar nova senha</label>
                        <input type="password" class="form-control" name="confirmacao" id="confirmacao" minlength="8" required autocomplete="new-password">
                    </div>
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                        <button type="submit" class="btn btn-primary-agmeal px-4 fw-bold">Salvar e continuar</button>
                    </div>
                </form>
                <form action="{{ url_for('logout') }}" method="POST" class="mt-3 text-end">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <button type="submit" class="btn btn-link btn-sm text-muted p-0">Sair</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
